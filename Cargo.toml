[package]
name = "cansat"
version = "0.1.0"
authors = ["nekename <63245705+nekename@users.noreply.github.com>"]
edition = "2024"
resolver = "2"

[[bin]]
name = "cansat"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.53", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
# Remove `generic-queue-8` if you plan to use `embassy-time` WITH `embassy-executor`
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
embedded-hal = "1"
embedded-hal-0-2 = { package = "embedded-hal", version = "0.2" }
embedded-hal-async = "1"
esp-idf-hal = "0.47"
anyhow = "1"
bmp581 = "0.1"
lsm6dsox = "2.1"
lis3mdl = "0.1"
nmea = "0.8"
serde = { version = "1", features = ["derive"] }
rmp-serde = "1.3"
lora-phy = "3.0.1"

[build-dependencies]
embuild = "0.33.5"
